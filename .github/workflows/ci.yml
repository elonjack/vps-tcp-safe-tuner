name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash 语法检查
        run: |
          bash -n vps-tcp-tune.sh
          bash -n install.sh
          bash -n tests/test-shell.sh
      - name: Shell 功能测试
        run: bash tests/test-shell.sh
      - name: 真实 qdisc 保存与恢复测试
        run: sudo bash tests/test-qdisc-linux.sh
      - name: 隔离网络路由窗口与网关变更测试
        run: sudo bash tests/test-route-linux.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: warning
      - name: 静态安全断言
        shell: pwsh
        run: ./tests/test-static.ps1
